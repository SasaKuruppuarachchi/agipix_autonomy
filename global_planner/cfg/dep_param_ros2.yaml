dep_test_node:
  ros__parameters:
    odom_topic: "/drone0/sensor_measurements/odom"
    local_region_min: [-5.0, -5.0, -2.0]
    local_region_max: [5.0, 5.0, 2.0]
    global_region_min: [-20.0, -20.0, 0.0]
    global_region_max: [20.0, 20.0, 3.0]
    local_sample_thresh: 50
    global_sample_thresh: 50
    frontier_sample_thresh: 100
    dist_thresh: 0.8
    safe_distance_xy: 0.3
    safe_distance_z: 0.0
