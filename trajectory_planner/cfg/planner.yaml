Poly_RRT_test_node:
  ros__parameters:
    map_resolution: 0.1
    timeout: 0.1
    env_box: [-100.0, 100.0, -100.0, 100.0, 1.0, 1.0]
    rrt_incremental_distance: 0.5
    goal_reach_distance: 0.4
    rrt_connect_goal_ratio: 0.2
    max_shortcut_dist: 5.0
    ignore_unknown: true
    pass_goal_check: true

    poly_traj:
      polynomial_degree: 7
      differential_degree: 4
      continuity_degree: 3
      desired_velocity: 1.0 # this is not used. Will be overwritten.
      initial_radius: 0.5
      timeout: 0.1
      corridor_res: 5.0
      shrinking_factor: 0.5
      soft_constraint: false
      constraint_radius: 0.5
      sample_delta_time: 0.1
      maximum_iteration_num: 10
      use_pwl_failsafe: true

    bspline_traj:
      timestep: 0.1
      distance_threshold: 0.5
      max_vel: 1.0 # this is not used. Will be overwritten.
      max_acc: 1.0 # this is not used. Will be overwritten.
      weight_distance: 1.0
      weight_smoothness: 1.0
      weight_feasibility: 1.0
      plan_in_z_axis: false
      min_height: 0.7
      max_height: 1.3
      uncertain_aware_factor: 1.0
      max_path_length: 7.0
      max_obstacle_size: [10.0, 10.0, 10.0]

