/**:
  ros__parameters:
    takeoff_height: 1.0 # m
    frame_id: drone0/map
    odom_topic: sensor_measurements/odom
    wait_for_topics_ready: false
    takeoff_wait_timeout_sec: 8.0
    require_takeoff_feedback: false
    use_global_planner: true
    no_yaw_turning: false
    use_yaw_control: false
    desired_velocity: 1.5 # m/s
    desired_acceleration: 1.5 # m/s^2
    desired_angular_velocity: 0.5 # rad/s
    replan_time_for_dynamic_obstacles: 1.0
    trajectory_info_save_path: "No"

mission_tracking_executor_node:
  ros__parameters:
    drone_namespace: drone0
    # Keep consistent with navigation target publication behavior.
    target_topic: autonomous_flight/target_state
    target_timeout_s: 2.5
    use_input_yaw: true
    skip_takeoff_if_flying: true
    flying_height_threshold: 0.35
    debug_mode: false
    publish_target_rx_marker: true